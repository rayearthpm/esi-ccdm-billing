<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · ESI CCDM Billing</title>
<style>
:root{--bg:#f2f4f8;--card:#fff;--ink:#16203a;--mut:#5b6478;--line:#d9deea;--acc:#1d5fd6;--acc2:#6aa2ff;--bad:#b3261e;--ok:#16a34a;--glow:rgba(29,95,214,.18)}
@media(prefers-color-scheme:dark){:root{--bg:#0e1424;--card:#171f35;--ink:#e8ecf6;--mut:#9aa5bf;--line:#2a3452;--acc:#6b9cff;--acc2:#2f66d9;--bad:#ff8a80;--ok:#4ade80;--glow:rgba(107,156,255,.2)}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif;padding:16px;overflow:hidden;position:relative}
.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.55;pointer-events:none;background:radial-gradient(circle,var(--acc) 0,transparent 70%);transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.o1{width:44vmax;height:44vmax;left:-14vmax;top:-18vmax}.o2{width:38vmax;height:38vmax;right:-12vmax;bottom:-16vmax;background:radial-gradient(circle,var(--acc2) 0,transparent 70%)}
.o1{animation:fl1 16s ease-in-out infinite alternate}.o2{animation:fl2 19s ease-in-out infinite alternate}
@keyframes fl1{to{margin:5vmax 0 0 6vmax}}@keyframes fl2{to{margin:0 5vmax 6vmax 0}}
form{position:relative;z-index:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;width:100%;max-width:372px;display:grid;gap:14px;box-shadow:0 18px 50px -18px rgba(10,20,50,.35);animation:rise .6s cubic-bezier(.2,.8,.2,1) both;overflow:hidden}
form::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),var(--glow),transparent 70%);opacity:0;transition:opacity .3s}
form:hover::before{opacity:1}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}}
.brand{display:flex;align-items:center;gap:14px}.logo{width:64px;height:64px;border-radius:12px;display:block;object-fit:cover;flex:none;box-shadow:0 6px 16px -6px rgba(120,80,0,.5);animation:pop .7s cubic-bezier(.2,.9,.3,1.3) .15s both;transition:transform .3s,box-shadow .3s}.lw{position:relative;display:block;flex:none;width:64px;height:64px}.lw::after{content:"";position:absolute;inset:-6px;border-radius:17px;border:3px solid transparent;border-top-color:var(--acc);border-right-color:var(--acc2);opacity:0;transition:opacity .25s;pointer-events:none}.wait .lw::after{opacity:1;animation:spin .9s linear infinite}.wait .logo{animation:wob 1.2s ease-in-out infinite;transform-origin:50% 60%}@keyframes wob{0%,100%{transform:scale(1) rotate(0)}25%{transform:scale(1.07) rotate(-6deg)}50%{transform:scale(.96) rotate(0)}75%{transform:scale(1.07) rotate(6deg)}}.logo:hover{transform:rotate(-4deg) scale(1.06)}@keyframes pop{from{opacity:0;transform:scale(.6) rotate(-12deg)}}
h1{margin:0;font-size:19px;line-height:1.15}p{margin:0;color:var(--mut)}
label{display:grid;gap:5px;font-weight:600;font-size:13px;transition:color .2s}label:focus-within{color:var(--acc)}
input:not([type=checkbox]){font:inherit;width:100%;padding:10px;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--ink);transition:border-color .2s,box-shadow .2s}
input:not([type=checkbox]):focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px var(--glow)}
.pw{position:relative;display:flex}.pw input{flex:1;min-width:0;padding-right:58px}
.pw button.tg{position:absolute;right:4px;top:50%;transform:translateY(-50%);padding:4px 8px;border:0;background:transparent;color:var(--acc);font-size:12px;font-weight:600;cursor:pointer;width:auto}
.caps{display:none;align-items:center;gap:6px;color:#b45309;font-size:12px;font-weight:600}.caps.on{display:flex;animation:rise .25s both}
.rm{display:flex;align-items:center;gap:8px;font-weight:500;color:var(--mut);cursor:pointer}.rm input{width:16px;height:16px;accent-color:var(--acc)}
#e{color:var(--bad);min-height:1.4em;font-weight:600}
button.go{font:inherit;font-weight:600;padding:11px;border:0;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,box-shadow .2s,opacity .2s;box-shadow:0 6px 16px -6px var(--acc)}
button.go:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 10px 20px -8px var(--acc)}button.go:active:not(:disabled){transform:translateY(0)}button.go:disabled{opacity:.75;cursor:progress}
.sp{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:spin .7s linear infinite;display:none}.busy .sp{display:block}@keyframes spin{to{transform:rotate(360deg)}}
.shake{animation:shake .4s}@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
form.ok{border-color:var(--ok)}form.ok .logo{box-shadow:0 0 0 3px var(--ok)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<script>
function pwToggle(root){(root||document).querySelectorAll('.pw .tg').forEach(function(b){if(b._on)return;b._on=1;b.onclick=function(){var i=b.parentNode.querySelector('input'),h=i.type==='password';i.type=h?'text':'password';b.textContent=h?'Hide':'Show';b.setAttribute('aria-pressed',h);i.focus()}})};pwToggle();
var F=document.getElementById('f'),E=document.getElementById('e'),G=F.querySelector('.go'),T=document.getElementById('gt'),RM=document.getElementById('rm');
/* remembered username, greeting by time of day */
try{var ru=localStorage.getItem('esiUser');if(ru){F.u.value=ru;RM.checked=true;F.p.focus();document.getElementById('hi').textContent='Welcome back, '+ru}}catch(x){}
var hr=new Date().getHours();if(!RM.checked)document.getElementById('sub').textContent=(hr<12?'Good morning':hr<18?'Good afternoon':'Good evening')+'. Sign in to see the shared results.';
/* soft light that follows the pointer, background drifts slightly */
F.addEventListener('pointermove',function(e){var r=F.getBoundingClientRect();F.style.setProperty('--mx',(e.clientX-r.left)+'px');F.style.setProperty('--my',(e.clientY-r.top)+'px')});
document.addEventListener('pointermove',function(e){var x=(e.clientX/innerWidth-.5)*30,y=(e.clientY/innerHeight-.5)*30;document.querySelector('.o1').style.transform='translate('+x+'px,'+y+'px)';document.querySelector('.o2').style.transform='translate('+(-x)+'px,'+(-y)+'px)'});
/* caps lock warning */
function caps(e){if(e.getModifierState)document.getElementById('caps').classList.toggle('on',e.getModifierState('CapsLock'))}
F.p.addEventListener('keydown',caps);F.p.addEventListener('keyup',caps);F.p.addEventListener('blur',function(){document.getElementById('caps').classList.remove('on')});
function bad(m){E.textContent=m;F.classList.remove('shake');void F.offsetWidth;F.classList.add('shake');F.p.select()}
F.onsubmit=async function(ev){ev.preventDefault();G.disabled=true;G.classList.add('busy');F.classList.add('wait');T.textContent='Signing in…';E.textContent='';
 try{var r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:this.u.value,password:this.p.value})}),j=await r.json();
 if(r.ok){try{if(RM.checked)localStorage.setItem('esiUser',this.u.value);else localStorage.removeItem('esiUser')}catch(x){}
  F.classList.remove('wait');F.classList.add('ok');T.textContent='Signed in ✓';G.classList.remove('busy');setTimeout(function(){location.href='/'},450);return}
 bad(j.error||'Could not sign in.')}catch(x){bad('Could not reach the server.')}
 F.classList.remove('wait');G.disabled=false;G.classList.remove('busy');T.textContent='Sign in'};
