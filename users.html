<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Users · ESI CCDM Billing</title>
<style>
:root{--bg:#f2f4f8;--card:#fff;--ink:#16203a;--mut:#5b6478;--line:#d9deea;--acc:#1d5fd6;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#0e1424;--card:#171f35;--ink:#e8ecf6;--mut:#9aa5bf;--line:#2a3452;--acc:#6b9cff;--bad:#ff8a80}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif;padding:20px}
main{max-width:760px;margin:auto;display:grid;gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;overflow:auto}
h1{margin:0;font-size:20px}h2{margin:0 0 12px;font-size:15px;text-transform:uppercase;letter-spacing:.03em}a{color:var(--acc)}
table{border-collapse:collapse;width:100%}td,th{padding:8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-size:12px}
input,select,button{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink)}
button{cursor:pointer}button.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap}#m{min-height:1.4em;color:var(--mut)}
</style></head><body><main>
<div><h1>Users</h1><a href="/">← Back to billing</a></div>
<div class="card"><h2>Add a person</h2><div class="row"><input id="n" placeholder="Username"><input id="p" type="password" placeholder="Password (8+ characters)"><select id="r"><option value="viewer">Viewer (sees results only)</option><option value="admin">Publisher (uploads and publishes)</option></select><button class="p" id="a">Add</button></div><p id="m"></p></div>
<div class="card"><h2>People</h2><table id="t"></table></div>
</main><script>
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
async function api(m,u,b){var r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined}),j=await r.json();if(!r.ok)throw new Error(j.error||'failed');return j}
async function load(){var us=await api('GET','/api/users');$('t').innerHTML='<tr><th>Username</th><th>Role</th><th>Created</th><th></th></tr>'+us.map(function(u){return'<tr><td>'+esc(u.username)+'</td><td>'+(u.role==='admin'?'Publisher':'Viewer')+'</td><td>'+new Date(u.created).toLocaleDateString()+'</td><td><button data-pw="'+u.id+'">New password</button> <button data-del="'+u.id+'">Delete</button></td></tr>'}).join('')}
$('a').onclick=async function(){try{await api('POST','/api/users',{username:$('n').value,password:$('p').value,role:$('r').value});$('n').value=$('p').value='';$('m').textContent='Added.';load()}catch(e){$('m').textContent=e.message}};
$('t').onclick=async function(e){var pw=e.target.dataset.pw,d=e.target.dataset.del;
 try{if(pw){var v=prompt('New password (8+ characters)');if(!v)return;await api('PUT','/api/users/'+pw,{password:v});$('m').textContent='Password changed.'}
 if(d&&confirm('Delete this person?')){await api('DELETE','/api/users/'+d);load()}}catch(x){$('m').textContent=x.message}};
load();
</script></body></html>
