<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Users · ESI CCDM Billing</title>
<style>
:root{--bg:#f2f4f8;--card:#fff;--ink:#16203a;--mut:#5b6478;--line:#d9deea;--acc:#1d5fd6;--bad:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#0e1424;--card:#171f35;--ink:#e8ecf6;--mut:#9aa5bf;--line:#2a3452;--acc:#6b9cff;--bad:#ff8a80}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif;padding:20px}
main{max-width:760px;margin:auto;display:grid;gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;overflow:auto}
h1{margin:0;font-size:20px}h2{margin:0 0 12px;font-size:15px;text-transform:uppercase;letter-spacing:.03em}a{color:var(--acc)}
table{border-collapse:collapse;width:100%}td,th{padding:8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-size:12px}
input,select,button{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink)}
button{cursor:pointer}button.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.pw{position:relative;display:flex}.pw input{flex:1;min-width:0;padding-right:58px}.pw button.tg{position:absolute;right:4px;top:50%;transform:translateY(-50%);padding:4px 8px;border:0;background:transparent;color:var(--acc);font-size:12px;font-weight:600;cursor:pointer}.pw{min-width:220px}.row{display:flex;gap:8px;flex-wrap:wrap}#m{min-height:1.4em;color:var(--mut)}
</style></head><body><main>
<div><h1>Users</h1><a href="/">← Back to billing</a></div>
<div class="card"><h2>Add a person</h2><div class="row"><input id="n" placeholder="Username"><span class="pw"><input id="p" type="password" placeholder="Password (8+ characters)" autocomplete="new-password"><button type="button" class="tg" aria-pressed="false" aria-label="Show or hide password">Show</button></span><select id="r"><option value="viewer">Viewer (sees results only)</option><option value="admin">Publisher (uploads and publishes)</option></select><input id="b" placeholder="Banks, e.g. BDO,PNB (blank = all)" size="26"><button class="p" id="a">Add</button></div><p id="m"></p></div>
<div class="card hide" id="pwc" style="display:none"><h2 id="pwh">New password</h2><div class="row"><span class="pw"><input id="pw2" type="password" placeholder="New password (8+ characters)" autocomplete="new-password"><button type="button" class="tg" aria-pressed="false" aria-label="Show or hide password">Show</button></span><button id="pwg" type="button">Generate</button><button class="p" id="pws">Save password</button><button id="pwx">Cancel</button></div></div>
<div class="card"><h2>People</h2><table id="t"></table></div>
</main><script>
var $=function(i){return document.getElementById(i)};
function pwToggle(root){(root||document).querySelectorAll('.pw .tg').forEach(function(b){if(b._on)return;b._on=1;b.onclick=function(){var i=b.parentNode.querySelector('input'),h=i.type==='password';i.type=h?'text':'password';b.textContent=h?'Hide':'Show';b.setAttribute('aria-pressed',h);i.focus()}})};pwToggle();var PWU=null,PWK={},PWS={};
function pwClose(){PWU=null;$('pwc').style.display='none';$('pw2').value='';$('pw2').type='password';var b=$('pwc').querySelector('.tg');b.textContent='Show';b.setAttribute('aria-pressed','false')}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
async function api(m,u,b){var r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined}),j=await r.json();if(!r.ok)throw new Error(j.error||'failed');return j}
async function load(){var us=await api('GET','/api/users');us.forEach(function(u){var k='u:'+u.username;if(PWK[k]!==undefined){PWK[u.id]=PWK[k];PWS[u.id]=false;delete PWK[k]}});$('t').innerHTML='<tr><th>Username</th><th>Role</th><th>Banks</th><th>Password</th><th>Created</th><th></th></tr>'+us.map(function(u){return'<tr><td>'+esc(u.username)+'</td><td>'+(u.role==='admin'?'Publisher':'Viewer')+'</td><td>'+(u.role==='admin'?'All':esc(u.banks||'All'))+'</td><td>'+(PWK[u.id]?'<code>'+(PWS[u.id]?esc(PWK[u.id]):'••••••••')+'</code> <button data-sh="'+u.id+'">'+(PWS[u.id]?'Hide':'Show')+'</button> <button data-cp="'+u.id+'">Copy</button>':'<span style="color:var(--mut)">Set · stored hidden</span>')+'</td><td>'+new Date(u.created).toLocaleDateString()+'</td><td>'+(u.role==='admin'?'':'<button data-bk="'+u.id+'" data-cur="'+esc(u.banks||'')+'">Banks</button> ')+'<button data-pw="'+u.id+'">New password</button> <button data-del="'+u.id+'">Delete</button></td></tr>'}).join('')}
$('a').onclick=async function(){try{var np=$('p').value,nn=$('n').value.trim();var cr=await api('POST','/api/users',{username:$('n').value,password:np,role:$('r').value,banks:$('b').value});if(cr&&cr.id){PWK[cr.id]=np;PWS[cr.id]=false}else{PWK['u:'+nn]=np}$('n').value=$('p').value=$('b').value='';$('m').textContent='Added.';load()}catch(e){$('m').textContent=e.message}};
$('t').onclick=async function(e){var sh=e.target.dataset.sh,cp=e.target.dataset.cp;if(sh){PWS[sh]=!PWS[sh];load();return}if(cp){try{await navigator.clipboard.writeText(PWK[cp]);$('m').textContent='Password copied.'}catch(x){$('m').textContent='Copy blocked by the browser; use Show and copy it by hand.'}return}
 var pw=e.target.dataset.pw,d=e.target.dataset.del,bk=e.target.dataset.bk;
 try{if(bk){var nb=prompt('Banks this person may see, separated by commas (blank = all banks)',e.target.dataset.cur);if(nb===null)return;await api('PUT','/api/users/'+bk,{banks:nb});$('m').textContent='Banks updated.';load()}
 if(pw){PWU=pw;$('pwh').textContent='New password for '+(e.target.closest('tr').cells[0].textContent);$('pwc').style.display='';$('pw2').focus();return}
 if(d&&confirm('Delete this person?')){await api('DELETE','/api/users/'+d);load()}}catch(x){$('m').textContent=x.message}};
$('pws').onclick=async function(){var v=$('pw2').value;if(!PWU)return;if(v.length<8){$('m').textContent='Password must be at least 8 characters.';return}try{await api('PUT','/api/users/'+PWU,{password:v});PWK[PWU]=v;PWS[PWU]=false;$('m').textContent='Password changed. You can reveal it in the Password column until you leave this page.';pwClose();load()}catch(x){$('m').textContent=x.message}};
$('pwx').onclick=pwClose;
$('pwg').onclick=function(){var cs='ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789',a=new Uint32Array(12),o='';crypto.getRandomValues(a);for(var i=0;i<12;i++)o+=cs[a[i]%cs.length];var i2=$('pw2');i2.value=o;i2.type='text';var b=$('pwc').querySelector('.tg');b.textContent='Hide';b.setAttribute('aria-pressed','true')};
load();
</script></body></html>
